version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: taskflow-postgres
    restart: always

    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow123
      POSTGRES_DB: taskflow_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: taskflow-backend

    restart: always

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: taskflow-frontend

    restart: always

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data: